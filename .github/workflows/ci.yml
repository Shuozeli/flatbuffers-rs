name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check all features
        run: cargo check --release --workspace --all-features --locked

      - name: Test default features
        run: cargo test --release --workspace --locked

      - name: Test all features
        run: cargo test --release --workspace --all-features --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy default feature contract
        run: cargo clippy --release --workspace --locked -- -D warnings

      - name: Clippy all-feature production targets
        run: cargo clippy --release --workspace --all-features --lib --bins --locked -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install TypeScript test dependencies
        run: pnpm --dir typescript-tests install --frozen-lockfile

      - name: Type-check and run generated TypeScript
        run: pnpm --dir typescript-tests test

  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install grammar dependencies
        run: pnpm --dir grammar install --frozen-lockfile

      - name: Verify generated grammar files
        run: |
          pnpm --dir grammar generate
          git diff --exit-code -- \
            grammar/src/parser.c \
            grammar/src/grammar.json \
            grammar/src/node-types.json

      - name: Test grammar corpus
        run: pnpm --dir grammar test

      - name: Test Rust grammar binding
        run: cargo test --release -p flatc-rs-grammar --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install WASM test dependencies
        run: pnpm --dir wasm-api install --frozen-lockfile

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.114 --locked

      - name: Verify WASM excludes CLI dependencies
        run: |
          if cargo tree -p flatc-rs-wasm -e normal | grep -q 'clap v'; then
            echo 'flatc-rs-wasm must not depend on clap' >&2
            exit 1
          fi

      - name: Build release WASM package
        run: |
          cargo build --release -p flatc-rs-wasm \
            --target wasm32-unknown-unknown \
            --locked
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/flatc_rs_wasm.wasm \
            --out-dir wasm-api/pkg \
            --target nodejs

      - name: Test generated WASM package in Node.js
        run: pnpm --dir wasm-api test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify public crate set
        shell: bash
        run: |
          diff -u \
            <(printf '%s\n' flatc-rs-runtime flatc-rs-schema) \
            <(cargo metadata --no-deps --format-version 1 | \
              jq -r '.packages[] | select(.publish == null or (.publish | length > 0)) | .name' | \
              sort)

      - name: Package public crates
        run: |
          cargo package --locked -p flatc-rs-runtime
          cargo package --locked -p flatc-rs-schema
