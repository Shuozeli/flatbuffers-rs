name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check all features
        run: cargo check --release --workspace --all-features --locked

      - name: Test default features
        run: cargo test --release --workspace --locked

      - name: Test all features
        run: cargo test --release --workspace --all-features --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy default feature contract
        run: cargo clippy --release --workspace --locked -- -D warnings

      - name: Clippy all-feature production targets
        run: cargo clippy --release --workspace --all-features --lib --bins --locked -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install TypeScript test dependencies
        run: pnpm --dir typescript-tests install --frozen-lockfile

      - name: Type-check and run generated TypeScript
        run: pnpm --dir typescript-tests test
